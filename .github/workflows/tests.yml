name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  tests-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tasktracker
          POSTGRES_USER: tasktracker
          POSTGRES_PASSWORD: tasktracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasktracker -d tasktracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tasktracker:tasktracker@localhost:5432/tasktracker
      TEST_DATABASE_URL: postgresql+psycopg://tasktracker:tasktracker@localhost:5432/tasktracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply, roll back and re-apply on a clean PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Full suite against PostgreSQL
        run: pytest -q
